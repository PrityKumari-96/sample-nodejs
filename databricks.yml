# Databricks Asset Bundle (DAB) Configuration for Databricks Apps
bundle:
  name: sample_nodejs_api

targets:
  dev:
    default: true
    mode: development

resources:
  apps:
    sample_nodejs_api:
      name: "sample-nodejs-api"
      description: "Node.js REST API with health check running on Databricks Apps"
      source_code_path: .
